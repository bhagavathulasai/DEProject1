services:
  api:
    build:
      context: .
    container_name: dentalvision-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/dentalvision
      APP_ENV: development
      PORT: 8000
      DENTALVISION_MODEL_DIR: /app/models
      DENTALVISION_MODEL_PATH: /app/models/Improved_CNN_trained.keras
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: dentalvision-db
    environment:
      POSTGRES_DB: dentalvision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dentalvision"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
